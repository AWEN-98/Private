services:
  bridge:
    build: .
    restart: unless-stopped
    init: true
    environment:
      BRIDGE_KEY: ${BRIDGE_KEY}
      HEADLESS: "false"
      BROWSER_PROFILE: /data/profile
    volumes:
      - ./profile:/data/profile
    ports:
      - "127.0.0.1:6080:6080"
    shm_size: "1gb"
  https:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bridge
volumes:
  caddy-data:
  caddy-config:
