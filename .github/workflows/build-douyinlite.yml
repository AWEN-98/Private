name: Build DouyinLite iOS 8
on:
  push:
    branches: [main]
    paths:
      - 'douyinlite/**'
      - '.github/workflows/build-douyinlite.yml'
  workflow_dispatch:
concurrency:
  group: douyinlite-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify local request signer
        run: |
          node douyinlite/tests/test_signer.js
          python3 douyinlite/tests/test_phone_only.py
          python3 douyinlite/tests/test_playlist.py
          python3 douyinlite/tests/test_guest_feed_qr_ui.py
          python3 douyinlite/tests/test_hot_fallback.py
          python3 douyinlite/tests/test_search_live_ui.py
          python3 douyinlite/tests/test_0141_recovery.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl make clang lld unzip zip xz-utils ca-certificates libarchive-tools dpkg-dev binutils python3
      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      - name: Obtain iOS 10.3 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/douyin-sdks
          git -C /tmp/douyin-sdks sparse-checkout set iPhoneOS10.3.sdk
          cp -a /tmp/douyin-sdks/iPhoneOS10.3.sdk "$HOME/theos/sdks/"
      - name: Compile and package
        # V0.14.1: compile remote Chrome viewer and package ARMv7 DEB
        # Retry V0.14.1 package with retained diagnostic output
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          cd douyinlite
          python3 scripts/generate_icons.py
          make clean package FINALPACKAGE=1 THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip 2>&1 | tee "$GITHUB_WORKSPACE/douyinlite-build.log"
      - name: Preserve compiler log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLite-v0.14.1-build-log
          path: douyinlite-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit failure diagnostics for direct inspection
        if: failure()
        run: |
          mkdir -p diagnostics
          {
            echo "DouyinLite 0.14.1 build failure"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Workflow logs: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -f douyinlite-build.log ]; then
              tail -n 300 douyinlite-build.log
            else
              echo "No compiler log. Failure occurred during runner setup or dependency installation."
            fi
          } > diagnostics/douyinlite-0.14.1-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/douyinlite-0.14.1-failure.txt
          git commit -m "ci: save DouyinLite failed build diagnostics [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - name: Validate iOS 8 DEB
        run: |
          set -euo pipefail
          DEB="$(find douyinlite/packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          mkdir -p /tmp/douyin-repack
          dpkg-deb -R "$DEB" /tmp/douyin-repack
          cp douyinlite/scripts/postinst /tmp/douyin-repack/DEBIAN/postinst
          chmod 755 /tmp/douyin-repack/DEBIAN/postinst
          dpkg-deb --root-owner-group -Zgzip -z6 --build /tmp/douyin-repack "$DEB"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.14.1"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          ar t "$DEB" | grep -Fx 'data.tar.gz'
          ar t "$DEB" | grep -Fx 'control.tar.gz'
          mkdir -p /tmp/douyin-unpack /tmp/douyin-ipa/Payload
          dpkg-deb -x "$DEB" /tmp/douyin-unpack
          APP=/tmp/douyin-unpack/Applications/DouyinLite.app
          test -x "$APP/DouyinLite"
          test -s "$APP/Info.plist"
          test -s "$APP/Icon@2x.png"
          test -s "$APP/DLSigner.js"
          test -s "$APP/ThirdPartyNotices.txt"
          file "$APP/DouyinLite" | grep -F 'Mach-O armv7 executable'
          python3 - "$APP/Info.plist" <<'PYTEST'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f:p=plistlib.load(f)
          assert p["CFBundleIdentifier"]=="com.finn.douyinlite"
          assert p["MinimumOSVersion"]=="8.0"
          assert p["CFBundleShortVersionString"]=="0.14.1"
          print("Verified iOS 8 app identity and version")
          PYTEST
          cp -a "$APP" /tmp/douyin-ipa/Payload/DouyinLite.app
          mkdir -p downloads
          (cd /tmp/douyin-ipa && zip -qr -X "$GITHUB_WORKSPACE/downloads/DouyinLite-iOS8-v0.14.1.ipa" Payload)
          cp "$DEB" downloads/DouyinLite-iOS8-v0.14.1.deb
          (cd downloads && zip -q -9 DouyinLite-iOS8-v0.14.1.zip DouyinLite-iOS8-v0.14.1.deb)
          unzip -t downloads/DouyinLite-iOS8-v0.14.1.zip | tail -1
          sha256sum downloads/DouyinLite-iOS8-v0.14.1.*
      - name: Upload install packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLite-iOS8-v0.14.1
          path: |
            downloads/DouyinLite-iOS8-v0.14.1.deb
            downloads/DouyinLite-iOS8-v0.14.1.ipa
            downloads/DouyinLite-iOS8-v0.14.1.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/DouyinLite-iOS8-v0.14.1.deb downloads/DouyinLite-iOS8-v0.14.1.zip downloads/DouyinLite-iOS8-v0.14.1.ipa
          if ! git diff --cached --quiet; then
            git commit -m "release: verified DouyinLite 0.14.1 armv7 install packages [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Unable to publish verified install packages after five attempts" >&2
            exit 1
          fi
