name: Test Douyin anonymous desktop feed
on:
  push:
    branches: [main]
    paths:
      - 'douyinlite/scripts/probe_anonymous_web.py'
      - 'douyinlite/scripts/probe_public_share.py'
      - '.github/workflows/probe-douyin-anonymous.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight browser automation
        run: |
          python -m pip install --disable-pip-version-check playwright
          which google-chrome
      - name: Browse actual logged-out Douyin webpage
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          python douyinlite/scripts/probe_anonymous_web.py >diagnostics/douyin-browser-run.log 2>&1 || true
          tail -n 50 diagnostics/douyin-browser-run.log
      - name: Test actual public Douyin share page with visitor cookie retry
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          python douyinlite/scripts/probe_public_share.py || true
          cat diagnostics/douyin-public-share-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-anonymous-probe-log
          path: |
            diagnostics/douyin-anonymous-probe.json
            diagnostics/douyin-public-share-probe.json
            diagnostics/douyin-browser-run.log
            downloads/douyin-public-feed.json
          if-no-files-found: ignore
          retention-days: 7
