name: Test Douyin anonymous desktop feed
on:
  push:
    branches: [main]
    paths:
      - 'douyinlite/scripts/probe_anonymous_web.py'
      - '.github/workflows/probe-douyin-anonymous.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight browser automation
        run: |
          python -m pip install --disable-pip-version-check playwright
          which google-chrome
      - name: Browse actual logged-out Douyin webpage
        continue-on-error: true
        run: python douyinlite/scripts/probe_anonymous_web.py
      - name: Commit probe result and optional public video manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/douyin-anonymous-probe.json downloads/douyin-public-feed.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "test: save anonymous Douyin browser probe results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-anonymous-probe-log
          path: |
            diagnostics/douyin-anonymous-probe.json
            downloads/douyin-public-feed.json
          if-no-files-found: ignore
          retention-days: 7
