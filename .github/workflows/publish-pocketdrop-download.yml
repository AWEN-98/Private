name: Publish PocketDrop Direct Downloads
# Verified packages in downloads/ are intentionally tracked
on:
  push:
    paths:
      - '.github/workflows/publish-pocketdrop-download.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified armv7 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/verified
          gh run download 40776756604 -R AWEN-98/Private -n 'pocketdrop-ios8-deb' -D /tmp/verified
          DEB="$(find /tmp/verified -maxdepth 2 -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.2.0"
          ar t "$DEB" | grep -qx data.tar.gz
          mkdir -p downloads
          cp "$DEB" "downloads/PocketDrop-iOS8-v0.2.0.deb"
          (cd downloads && zip -q -9 "PocketDrop-iOS8-v0.2.0.zip" "PocketDrop-iOS8-v0.2.0.deb")
          unzip -t "downloads/PocketDrop-iOS8-v0.2.0.zip"
          sha256sum "downloads/PocketDrop-iOS8-v0.2.0.deb" "downloads/PocketDrop-iOS8-v0.2.0.zip"
      - name: Commit binary downloads for direct links
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/PocketDrop-iOS8-v0.2.0.deb downloads/PocketDrop-iOS8-v0.2.0.zip
          if ! git diff --cached --quiet; then
            git commit -m "release: publish verified PocketDrop direct download files [skip ci]"
            git push origin HEAD:main
          fi
