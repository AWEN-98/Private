name: Test DouyinBridge
on:
  push:
    branches: [main]
    paths:
      - 'douyinlite/bridge/**'
      - '.github/workflows/test-douyin-bridge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r douyinlite/bridge/requirements.txt
      - name: Syntax check and extraction unit tests
        run: |
          python -m py_compile douyinlite/bridge/app.py
          cd douyinlite/bridge
          python -m pytest -q test_app.py
      - name: Save errors in repo for inspection
        if: failure()
        run: |
          mkdir -p diagnostics
          echo "DouyinBridge CI failed: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > diagnostics/douyin-bridge-test-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/douyin-bridge-test-failure.txt
          git commit -m "ci: save bridge test failure [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
