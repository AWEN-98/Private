name: Build iOS 8 rootful DEB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl make clang lld perl rsync zip unzip fakeroot libxml2 xz-utils
      - name: Install Theos and iOS 9.3 SDK
        env:
          THEOS: /home/runner/theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks" "$HOME/theos/toolchain"
          curl -fsSL --retry 3 https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$HOME/theos/toolchain"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          "$HOME/theos/bin/install-sdk" iPhoneOS9.3
          test -f "$HOME/theos/sdks/iPhoneOS9.3.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"
          # Theos iOS 9.3 patched SDK refers to a missing liblaunch shim on Linux.
          sed -i "s@/usr/lib/system/liblaunch.dylib, @@g" "$HOME/theos/sdks/iPhoneOS9.3.sdk/usr/lib/libSystem.tbd"
      - name: Compile armv7 and package
        env:
          THEOS: ${{ github.workspace }}/.theos-link
        run: |
          ln -s "$HOME/theos" .theos-link
          cd ios/XiaoFeiAgent
          python3 gen_icons.py
          chmod 755 layout/DEBIAN/postinst
          make package FINALPACKAGE=1 THEOS="$HOME/theos" TARGET=iphone:clang:9.3:8.0 ARCHS=armv7
          # Legacy Cydia/dpkg may reject .xz control.tar; repack both tar members as gzip.
          original_deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$original_deb"
          mkdir -p repack_legacy
          dpkg-deb -R "$original_deb" repack_legacy
          chmod 755 repack_legacy/DEBIAN/postinst
          # iOS 8 rootful must not inherit the CI runner UID/GID.
          dpkg-deb --root-owner-group -Zgzip -z6 --build repack_legacy "$original_deb"
          # Package version must match the source control metadata.
          expected="$(sed -n 's/^Version: //p' control | head -1)"
          actual="$(dpkg-deb -f "$original_deb" Version)"
          test -n "$expected" && test "$actual" = "$expected"
          test "$(dpkg-deb -f "$original_deb" Architecture)" = "iphoneos-arm"
          python3 - "$original_deb" <<'PY'
          import plistlib, subprocess, sys
          from pathlib import Path
          import tempfile
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(["dpkg-deb", "-x", sys.argv[1], directory], check=True)
              plist=Path(directory)/"Applications/XiaoFeiAgent.app/Info.plist"
              with plist.open("rb") as stream: info=plistlib.load(stream)
              assert info.get("CFBundleShortVersionString") == subprocess.check_output(
                  ["dpkg-deb", "-f", sys.argv[1], "Version"], text=True).strip(), info
              assert info.get("MinimumOSVersion") == "8.0", info
          PY
          ar t "$original_deb" | grep -qx "control.tar.gz"
          ar t "$original_deb" | grep -qx "data.tar.gz"
          dpkg-deb -c "$original_deb" | grep -q 'XiaoFeiAgent.app/XiaoFeiAgent'
          dpkg-deb -c "$original_deb" | grep -q 'XiaoFeiAgent.app/Info.plist'
          ls -lh packages/*.deb
      - name: Compile and package PocketDrop
        env:
          THEOS: ${{ github.workspace }}/.theos-link
        run: |
          set -e
          python3 pocketdrop/tests/test_passwordless.py
          python3 pocketdrop/tests/test_cleanup.py
          cd pocketdrop
          python3 gen_icons.py
          make package FINALPACKAGE=1 THEOS="$HOME/theos" TARGET=iphone:clang:9.3:8.0 ARCHS=armv7
          original_deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$original_deb"
          mkdir -p repack_legacy
          dpkg-deb -R "$original_deb" repack_legacy
          cp scripts/postinst repack_legacy/DEBIAN/postinst
          chmod 755 repack_legacy/DEBIAN/postinst
          # Theos files compiled as runner must install as root:wheel/root on iOS 8.
          dpkg-deb --root-owner-group -Zgzip -z6 --build repack_legacy "$original_deb"
          test "$(dpkg-deb -f "$original_deb" Version)" = "0.4.1"
          ar t "$original_deb" | grep -qx "control.tar.gz"
          ar t "$original_deb" | grep -qx "data.tar.gz"
          dpkg-deb --ctrl-tarfile "$original_deb" | tar -tf - | grep -q 'postinst'
          dpkg-deb -c "$original_deb" | grep -q 'PocketDrop.app/PocketDrop'
          mkdir -p manual
          dpkg-deb -x "$original_deb" manual
          (cd manual/Applications && zip -qr -X ../../packages/PocketDrop-iFile-manual.app.zip PocketDrop.app)
      - name: Upload PocketDrop package
        uses: actions/upload-artifact@v4
        with:
          name: pocketdrop-ios8-deb
          path: |
            pocketdrop/packages/*.deb
            pocketdrop/packages/*-manual.app.zip
          if-no-files-found: error
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: xiaofei-agent-rootful-deb
          path: ios/XiaoFeiAgent/packages/*.deb
          if-no-files-found: error
